name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      # Testler canlı app.db'ye dokunmaz: vite.config.js test.env APP_DB_PATH'i ayrı bir dosyaya
      # yönlendirir, vitest.globalSetup.js her koşuda onu sıfırlar. Dış servis çağrıları
      # testlerde sahte (vi.mock / vi.stubGlobal); API anahtarı ya da server/.env gerekmez.
      - run: npm test

      - run: npm run build

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline-python
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-pipeline-python/requirements.txt

      - run: pip install -r requirements.txt

      # conftest.py canlı veritabanlarını korur; ağ gerektiren betikler test kapsamında değil.
      # data/ dizini depoda yok (gitignore) — testler tmp_path kullanır.
      - run: python -m pytest
