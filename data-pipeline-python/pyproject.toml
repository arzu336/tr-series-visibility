[project]
name = "gorunurluk-data-pipeline"
version = "0.1.0"
description = "Kültürel Görünürlük Platformu — Node uygulamasından bağımsız Python zenginleştirme hattı (Netflix Top 10, reytingtv, dizilah, IMDb veri setleri)"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.12.3",
  "lxml==5.2.2",
  "pandas==2.2.2",
  "pydantic==2.13.1",
  "python-dotenv==1.2.2",
  "requests==2.32.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"
# conftest.py canlı veritabanlarını (data/pipeline.db, ../server/data/app.db) her testte korur.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
